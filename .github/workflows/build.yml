name: Build EyeScroll APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate project files
        run: |
          mkdir -p "EyeScroll/"
          cat > "EyeScroll/settings.gradle.kts" <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EyeScroll"
          include(":app")
          EOF_FILE
          mkdir -p "EyeScroll/"
          cat > "EyeScroll/build.gradle.kts" <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p "EyeScroll/"
          cat > "EyeScroll/gradle.properties" <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p "EyeScroll/app"
          cat > "EyeScroll/app/build.gradle.kts" <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.eyescroll.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.eyescroll.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("com.google.mlkit:face-detection:16.1.7")
          }
          EOF_FILE
          mkdir -p "EyeScroll/app/src/main"
          cat > "EyeScroll/app/src/main/AndroidManifest.xml" <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera.front" android:required="true" />

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".EyeTrackingService"
                      android:exported="false"
                      android:foregroundServiceType="camera" />

                  <service
                      android:name=".ScrollAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "EyeScroll/app/src/main/res/values"
          cat > "EyeScroll/app/src/main/res/values/strings.xml" <<'EOF_FILE'
          <resources>
              <string name="app_name">EyeScroll</string>
              <string name="a11y_desc">Swipes up or down in Instagram when the camera detects your blink or head tilt.</string>
          </resources>
          EOF_FILE
          mkdir -p "EyeScroll/app/src/main/res/xml"
          cat > "EyeScroll/app/src/main/res/xml/accessibility_config.xml" <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/a11y_desc" />
          EOF_FILE
          mkdir -p "EyeScroll/app/src/main/java/com/eyescroll/app"
          cat > "EyeScroll/app/src/main/java/com/eyescroll/app/ScrollAccessibilityService.kt" <<'EOF_FILE'
          package com.eyescroll.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class ScrollAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile var instance: ScrollAccessibilityService? = null
                  private const val INSTAGRAM = "com.instagram.android"
              }

              @Volatile private var foregroundPackage: String? = null

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      event.packageName?.toString()?.let { foregroundPackage = it }
                  }
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              /** next = true swipes up (next reel/post); false swipes down (previous). */
              fun swipe(next: Boolean) {
                  if (foregroundPackage != INSTAGRAM) return // only ever scroll Instagram
                  val m = resources.displayMetrics
                  val x = m.widthPixels / 2f
                  val from = m.heightPixels * if (next) 0.75f else 0.30f
                  val to = m.heightPixels * if (next) 0.30f else 0.75f
                  val path = Path().apply { moveTo(x, from); lineTo(x, to) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 250))
                      .build()
                  dispatchGesture(gesture, null, null)
              }
          }
          EOF_FILE
          mkdir -p "EyeScroll/app/src/main/java/com/eyescroll/app"
          cat > "EyeScroll/app/src/main/java/com/eyescroll/app/EyeTrackingService.kt" <<'EOF_FILE'
          package com.eyescroll.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.SystemClock
          import android.util.Size
          import androidx.annotation.OptIn
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ExperimentalGetImage
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.ServiceCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.Face
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetector
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.abs

          class EyeTrackingService : LifecycleService() {

              // ---- Tune these to taste ----
              private val blinkHoldMs = 500L      // eyes closed this long = "next"
              private val eyeClosedBelow = 0.25f  // eye-open probability threshold
              private val tiltDegrees = 20f       // head roll angle for "previous"
              private val tiltHoldMs = 350L
              private val cooldownMs = 900L
              // -----------------------------

              private lateinit var executor: ExecutorService
              private lateinit var detector: FaceDetector

              private var closedSince = 0L
              private var blinkFired = false
              private var tiltSince = 0L
              private var tiltFired = false
              private var lastActionAt = 0L

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()
                  executor = Executors.newSingleThreadExecutor()
                  detector = FaceDetection.getClient(
                      FaceDetectorOptions.Builder()
                          .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_FAST)
                          .setClassificationMode(FaceDetectorOptions.CLASSIFICATION_MODE_ALL)
                          .build()
                  )
                  startCamera()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("eyescroll", "EyeScroll", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notification = Notification.Builder(this, "eyescroll")
                      .setContentTitle("EyeScroll is running")
                      .setContentText("Camera is on to detect blinks and head tilts.")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setOngoing(true)
                      .build()
                  ServiceCompat.startForeground(this, 1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA)
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      @Suppress("DEPRECATION")
                      val analysis = ImageAnalysis.Builder()
                          .setTargetResolution(Size(480, 360))
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                      analysis.setAnalyzer(executor) { process(it) }
                      provider.unbindAll()
                      provider.bindToLifecycle(this, CameraSelector.DEFAULT_FRONT_CAMERA, analysis)
                  }, ContextCompat.getMainExecutor(this))
              }

              @OptIn(ExperimentalGetImage::class)
              private fun process(proxy: ImageProxy) {
                  val media = proxy.image
                  if (media == null) { proxy.close(); return }
                  val image = InputImage.fromMediaImage(media, proxy.imageInfo.rotationDegrees)
                  detector.process(image)
                      .addOnSuccessListener { faces -> faces.firstOrNull()?.let { onFace(it) } }
                      .addOnCompleteListener { proxy.close() }
              }

              private fun onFace(face: Face) {
                  val now = SystemClock.elapsedRealtime()

                  // Deliberate long blink -> next
                  val l = face.leftEyeOpenProbability
                  val r = face.rightEyeOpenProbability
                  if (l != null && r != null) {
                      if (l < eyeClosedBelow && r < eyeClosedBelow) {
                          if (closedSince == 0L) closedSince = now
                          else if (!blinkFired && now - closedSince >= blinkHoldMs) {
                              blinkFired = true
                              trigger(next = true, now = now)
                          }
                      } else {
                          closedSince = 0L
                          blinkFired = false
                      }
                  }

                  // Head tilt (either side) -> previous
                  if (abs(face.headEulerAngleZ) > tiltDegrees) {
                      if (tiltSince == 0L) tiltSince = now
                      else if (!tiltFired && now - tiltSince >= tiltHoldMs) {
                          tiltFired = true
                          trigger(next = false, now = now)
                      }
                  } else {
                      tiltSince = 0L
                      tiltFired = false
                  }
              }

              private fun trigger(next: Boolean, now: Long) {
                  if (now - lastActionAt < cooldownMs) return
                  lastActionAt = now
                  ScrollAccessibilityService.instance?.swipe(next)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  super.onDestroy()
                  detector.close()
                  executor.shutdown()
              }
          }
          EOF_FILE
          mkdir -p "EyeScroll/app/src/main/java/com/eyescroll/app"
          cat > "EyeScroll/app/src/main/java/com/eyescroll/app/MainActivity.kt" <<'EOF_FILE'
          package com.eyescroll.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }
                  fun add(button: Button, action: () -> Unit) {
                      button.setOnClickListener { action() }
                      root.addView(button)
                  }

                  root.addView(TextView(this).apply { text = "EyeScroll"; textSize = 28f })
                  root.addView(TextView(this).apply {
                      text = "Hold a blink (about half a second) = next.\nTilt your head = previous.\nOnly works while Instagram is open."
                      setPadding(0, pad / 2, 0, pad / 2)
                  })

                  add(Button(this).apply { text = "1. Allow camera" }) {
                      requestPermissions(
                          arrayOf(Manifest.permission.CAMERA, Manifest.permission.POST_NOTIFICATIONS), 1
                      )
                  }
                  add(Button(this).apply { text = "2. Enable accessibility service" }) {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  add(Button(this).apply { text = "3. Start" }) {
                      when {
                          checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED ->
                              toast("Allow the camera first")
                          ScrollAccessibilityService.instance == null ->
                              toast("Enable the EyeScroll accessibility service first")
                          else -> {
                              startForegroundService(Intent(this, EyeTrackingService::class.java))
                              toast("Running. Open Instagram.")
                          }
                      }
                  }
                  add(Button(this).apply { text = "Stop" }) {
                      stopService(Intent(this, EyeTrackingService::class.java))
                  }

                  status = TextView(this).apply { setPadding(0, pad / 2, 0, 0) }
                  root.addView(status)
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  val cam = checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  val a11y = ScrollAccessibilityService.instance != null
                  status.text = "Camera: ${if (cam) "allowed" else "not allowed"}\nAccessibility: ${if (a11y) "on" else "off"}"
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
          }
          EOF_FILE
      - name: Build debug APK
        working-directory: EyeScroll
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EyeScroll-APK
          path: EyeScroll/app/build/outputs/apk/debug/app-debug.apk
